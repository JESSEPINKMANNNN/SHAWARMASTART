<!-- This file exists solely for Netlify form detection. Netlify scans static HTML at build time. -->
<form name="new-orders" netlify netlify-honeypot="bot-field" hidden>
  <input name="bot-field" />
  <input name="orderId" />
  <input name="customerName" />
  <input name="customerPhone" />
  <input name="customerEmail" />
  <input name="customerAddress" />
  <textarea name="orderDetails"></textarea>
  <input name="totalBill" />
</form>
